[project]
name = "omp-memory-daemon"
version = "1.0.0"
description = "Hybrid Semantic Search Daemon"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.4",
    "sentence-transformers>=6.0.0",
    "sqlite-vec>=0.1.9",
    "torch",
    "torchvision",
    "torchcodec"
]

# PyTorch의 CUDA 호환 휠(Wheel)을 가져오기 위한 명시적 인덱스 지정
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

# dependencies 에 실제로 있는 배포판만 매핑합니다. 이전에는 torchaudio 를
# 가리켰는데 그 패키지는 의존성 목록에 없어 매핑이 비활성이었고, 정작 필요한
# torchcodec 은 매핑에서 빠져 기본 인덱스(PyPI)의 CPU 빌드로 해석될 수
# 있었습니다. 같은 이미지 안에서 torch 는 cu132, torchcodec 은 CPU 빌드가
# 섞이면 ABI 가 어긋나므로 세 배포판을 모두 같은 인덱스로 고정합니다.
[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchcodec = { index = "pytorch-cu132" }
